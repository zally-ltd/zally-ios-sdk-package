name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  security:
    uses: zally-ltd/zally-ci-pipelines/.github/workflows/security-layer.yml@v1
    with:
      scan-path: .
